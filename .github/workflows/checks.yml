name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regressions:
    name: Regressions (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'      # Apple's python3: the oldest the app runs on
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-26
            python: system     # the python3 the app itself uses; the Swift tests compile and typecheck Sources/Rabik
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python ${{ matrix.python }}
        if: matrix.python != 'system'
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Offline brain, UI and Swift regressions
        run: python3 --version && python3 -m unittest discover -s tests -v
      - name: Build script syntax
        run: bash -n build.sh
