<!doctype html><meta charset="utf-8"><title>Agent done card fixture</title>
<iframe id="preview"></iframe><pre id="results">Running…</pre>
<script type="module">
const frame=document.getElementById('preview'),results=document.getElementById('results'),messages=[];
const html=await(await fetch('../ui/ui.html')).text(),orbs=await(await fetch('../ui/orbs.js')).text();
const ready=new Promise(resolve=>window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;messages.push(event.data);if(event.data.ready)resolve();}));
const bridge=`<script>window.webkit={messageHandlers:{c:{postMessage:m=>parent.postMessage(m,'*')},h:{postMessage(){}}}};<\/script>`;
frame.srcdoc=html.replace('/*ORBS*/',()=>orbs).replace('<head>','<head>'+bridge);
try{
 await Promise.race([ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('UI did not initialize')),5000))]);
 const w=frame.contentWindow,d=w.document,row={id:'11111111111111111111111111111111',title:'Prepare report',summary:'The report is ready.',links:['/tmp/result.csv']};
 w.ui.agentDone(row);d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));await new Promise(resolve=>setTimeout(resolve,20));
 if(!messages.some(message=>message.agentOpen===row.id&&message.target==='/tmp/result.csv'))throw Error('Return did not open what the agent made');
 results.textContent='Return opens what the completed agent made.';results.className='pass';
}catch(error){results.textContent=error.message;results.className='fail';}
</script>
