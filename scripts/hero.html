<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Rabik hero</title>
<!-- The README's top image: scripts/readme-shots.py fills in the icon and a real box answer, then draws this page.
     Warm paper, Apple's New York serif for the headline and SF Pro for the rest; no gradients. -->
<style>
  html, body { margin: 0; width: 1200px; height: 560px; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; color: #24211c; background: #faf7f1;
         display: grid; grid-template-columns: 1fr 450px; align-items: center; gap: 56px; padding: 0 76px 0 88px; box-sizing: border-box;
         -webkit-font-smoothing: antialiased; }
  .eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
  .eyebrow img { width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 1px 2px rgba(60, 40, 20, .12), 0 6px 16px rgba(60, 40, 20, .10); }
  .eyebrow b { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .eyebrow span { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #9a8f7f; margin-left: 6px; }
  h1 { margin: 0; font-family: "New York", ui-serif, Georgia, serif; font-weight: 500; font-size: 68px; line-height: 1.02; letter-spacing: -.025em; }
  h1 em { font-style: italic; font-weight: 400; color: #8a5a2b; }
  p { margin: 26px 0 0; font-size: 19px; line-height: 1.55; color: #5f584d; max-width: 500px; }
  .how { margin-top: 28px; font-size: 15px; color: #8a8072; letter-spacing: .01em; } .how b { color: #3a352d; font-weight: 600; }
  .box { justify-self: end; width: 440px; border-radius: 18px; background: #1c1c21; overflow: hidden;
         box-shadow: 0 1px 2px rgba(40, 28, 14, .10), 0 24px 60px rgba(40, 28, 14, .22); }
  .box img { display: block; width: 100%; }
</style>
<div>
  <div class="eyebrow"><img src="{{ICON}}" alt=""><b>Rabik</b><span>for Mac</span></div>
  <h1>Talk to your Mac.<br><em>It remembers.</em></h1>
  <p>Ask out loud and Rabik works your apps, your screen and the web, sits in on your calls, and answers from what it knows about your days.</p>
  <div class="how">Hold <b>⌃⌥Space</b>, ask, let go.</div>
</div>
<div class="box"><img src="{{BOX}}" alt=""></div>
