<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Rabik hero</title>
<!-- The README's top image: scripts/readme-shots.py fills in the icon and a real box answer, then draws this page. -->
<style>
  html, body { margin: 0; width: 1200px; height: 560px; overflow: hidden; }
  body { font-family: -apple-system, system-ui, sans-serif; color: #f5f5f7; display: grid; grid-template-columns: 1fr 470px; align-items: center; gap: 40px;
         padding: 0 72px 0 84px; box-sizing: border-box;
         background: radial-gradient(900px 520px at 88% 30%, rgba(94, 92, 230, .42), transparent 60%),
                     radial-gradient(700px 480px at 10% 110%, rgba(48, 176, 199, .30), transparent 60%),
                     linear-gradient(135deg, #15151c 0%, #1d1b2b 55%, #24182a 100%); }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
  .brand b { font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
  h1 { margin: 0; font-size: 56px; line-height: 1.04; font-weight: 700; letter-spacing: -.03em; }
  h1 span { background: linear-gradient(90deg, #a5a3ff, #64d2ff); -webkit-background-clip: text; color: transparent; }
  p { margin: 22px 0 0; font-size: 20px; line-height: 1.5; color: #b9b9c3; max-width: 520px; }
  .tags { display: flex; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
  .tags i { font-style: normal; font-size: 14px; font-weight: 500; color: #e5e5ea; padding: 6px 12px; border-radius: 999px;
            background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .16); }
  .box { justify-self: end; width: 440px; border-radius: 18px; background: rgba(28, 28, 33, .94); overflow: hidden;
         box-shadow: 0 40px 80px rgba(0, 0, 0, .55), inset 0 0 0 .5px rgba(255, 255, 255, .14); }
  .box img { display: block; width: 100%; }
</style>
<div>
  <div class="brand"><img src="{{ICON}}" alt=""><b>Rabik</b></div>
  <h1>Talk to your Mac.<br><span>It remembers.</span></h1>
  <p>Ask out loud and Rabik works your apps, your screen and the web, keeps track of your meetings and days, and answers from what it knows about you.</p>
  <div class="tags"><i>Voice</i><i>Agents</i><i>Meetings</i><i>Memory</i><i>On your Mac</i></div>
</div>
<div class="box"><img src="{{BOX}}" alt=""></div>
